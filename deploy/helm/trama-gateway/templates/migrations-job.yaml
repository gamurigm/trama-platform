apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "trama-gateway.fullname" . }}-migrations
  labels:
    {{- include "trama-gateway.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "trama-gateway.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrations
          image: postgres:16-alpine
          command: ["sh", "-ec"]
          args:
            - >-
              psql "$TRAMA_DATABASE_URL" -v ON_ERROR_STOP=1
              -f /migrations/000001_gateway.sql
              -f /migrations/000002_control_plane.sql
              -f /migrations/000003_namespace_keys.sql
          env:
            - name: TRAMA_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.databaseURLKey }}
          volumeMounts:
            - name: migrations
              mountPath: /migrations
      volumes:
        - name: migrations
          configMap:
            name: {{ include "trama-gateway.fullname" . }}-migrations
