apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "trama-gateway.fullname" . }}-migrations
  labels:
    {{- include "trama-gateway.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
data:
  000001_gateway.sql: |
    CREATE SCHEMA IF NOT EXISTS gateway;
    CREATE TABLE IF NOT EXISTS gateway.admissions (
      admission_id TEXT PRIMARY KEY,
      organization_id TEXT NOT NULL,
      project_id TEXT NOT NULL,
      task_id TEXT NOT NULL,
      idempotency_key TEXT NOT NULL,
      request_hash TEXT NOT NULL,
      payload JSONB NOT NULL,
      status TEXT NOT NULL CHECK (status = 'accepted'),
      created_at TIMESTAMPTZ NOT NULL,
      UNIQUE (organization_id, idempotency_key),
      UNIQUE (organization_id, task_id)
    );
    CREATE TABLE IF NOT EXISTS gateway.task_projection (
      organization_id TEXT NOT NULL,
      project_id TEXT NOT NULL,
      task_id TEXT NOT NULL,
      payload JSONB NOT NULL,
      state TEXT NOT NULL,
      updated_at TIMESTAMPTZ NOT NULL,
      PRIMARY KEY (organization_id, task_id)
    );
    CREATE INDEX IF NOT EXISTS task_projection_project_updated_idx
      ON gateway.task_projection (organization_id, project_id, updated_at DESC);
    CREATE TABLE IF NOT EXISTS gateway.outbox (
      event_id TEXT PRIMARY KEY,
      event_type TEXT NOT NULL,
      organization_id TEXT NOT NULL,
      project_id TEXT NOT NULL,
      task_id TEXT NOT NULL,
      payload JSONB NOT NULL,
      created_at TIMESTAMPTZ NOT NULL,
      published_at TIMESTAMPTZ,
      attempts INTEGER NOT NULL DEFAULT 0,
      available_at TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,
      claim_token TEXT,
      claimed_until TIMESTAMPTZ
    );
    CREATE INDEX IF NOT EXISTS outbox_ready_idx
      ON gateway.outbox (available_at, created_at)
      WHERE published_at IS NULL;
  000002_control_plane.sql: |
    CREATE SCHEMA IF NOT EXISTS trama;
    CREATE TABLE IF NOT EXISTS trama.schema_migrations (
      version INTEGER PRIMARY KEY,
      applied_at TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP
    );
    CREATE TABLE IF NOT EXISTS trama.projects (
      organization_id TEXT NOT NULL,
      project_id TEXT NOT NULL,
      repository TEXT NOT NULL,
      default_branch TEXT NOT NULL,
      payload JSONB NOT NULL,
      updated_at TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,
      PRIMARY KEY (organization_id, project_id)
    );
    CREATE TABLE IF NOT EXISTS trama.requirements (
      organization_id TEXT NOT NULL,
      project_id TEXT NOT NULL,
      requirement_id TEXT NOT NULL,
      status TEXT NOT NULL,
      payload JSONB NOT NULL,
      updated_at TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,
      PRIMARY KEY (organization_id, requirement_id),
      FOREIGN KEY (organization_id, project_id)
        REFERENCES trama.projects (organization_id, project_id)
    );
    CREATE TABLE IF NOT EXISTS trama.plans (
      organization_id TEXT NOT NULL,
      project_id TEXT NOT NULL,
      proposal_id TEXT NOT NULL,
      requirement_id TEXT NOT NULL,
      status TEXT NOT NULL,
      version INTEGER NOT NULL,
      payload JSONB NOT NULL,
      updated_at TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,
      PRIMARY KEY (organization_id, proposal_id),
      FOREIGN KEY (organization_id, project_id)
        REFERENCES trama.projects (organization_id, project_id)
    );
    CREATE TABLE IF NOT EXISTS trama.phases (
      organization_id TEXT NOT NULL,
      project_id TEXT NOT NULL,
      phase_id TEXT NOT NULL,
      requirement_id TEXT NOT NULL,
      status TEXT NOT NULL,
      sequence INTEGER NOT NULL,
      payload JSONB NOT NULL,
      updated_at TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,
      PRIMARY KEY (organization_id, phase_id),
      FOREIGN KEY (organization_id, project_id)
        REFERENCES trama.projects (organization_id, project_id)
    );
    CREATE TABLE IF NOT EXISTS trama.tasks (
      organization_id TEXT NOT NULL,
      project_id TEXT NOT NULL,
      task_id TEXT NOT NULL,
      requirement_id TEXT,
      phase_id TEXT,
      state TEXT NOT NULL,
      payload JSONB NOT NULL,
      updated_at TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,
      PRIMARY KEY (organization_id, task_id),
      FOREIGN KEY (organization_id, project_id)
        REFERENCES trama.projects (organization_id, project_id)
    );
    CREATE TABLE IF NOT EXISTS trama.results (
      task_id TEXT PRIMARY KEY,
      payload JSONB NOT NULL,
      updated_at TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP
    );
    CREATE TABLE IF NOT EXISTS trama.memory_candidates (
      organization_id TEXT NOT NULL,
      project_id TEXT NOT NULL,
      candidate_id TEXT NOT NULL,
      status TEXT NOT NULL,
      payload JSONB NOT NULL,
      updated_at TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,
      PRIMARY KEY (organization_id, candidate_id),
      FOREIGN KEY (organization_id, project_id)
        REFERENCES trama.projects (organization_id, project_id)
    );
    CREATE TABLE IF NOT EXISTS trama.promotions (
      organization_id TEXT NOT NULL,
      project_id TEXT NOT NULL,
      promotion_id TEXT NOT NULL,
      status TEXT NOT NULL,
      payload JSONB NOT NULL,
      updated_at TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,
      PRIMARY KEY (organization_id, promotion_id),
      FOREIGN KEY (organization_id, project_id)
        REFERENCES trama.projects (organization_id, project_id)
    );
    CREATE TABLE IF NOT EXISTS trama.state_records (
      kind TEXT NOT NULL,
      record_id TEXT NOT NULL,
      organization_id TEXT NOT NULL,
      project_id TEXT,
      payload JSONB NOT NULL,
      updated_at TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP,
      PRIMARY KEY (kind, organization_id, record_id)
    );
    CREATE INDEX IF NOT EXISTS state_records_namespace_idx
      ON trama.state_records (organization_id, project_id, kind);
    CREATE TABLE IF NOT EXISTS trama.operation_events (
      event_id TEXT PRIMARY KEY,
      created_at TIMESTAMPTZ NOT NULL,
      organization_id TEXT NOT NULL,
      project_id TEXT,
      payload JSONB NOT NULL
    );
    CREATE INDEX IF NOT EXISTS operation_events_namespace_idx
      ON trama.operation_events (organization_id, project_id, created_at);
    CREATE TABLE IF NOT EXISTS trama.task_logs (
      log_id TEXT PRIMARY KEY,
      created_at TIMESTAMPTZ NOT NULL,
      organization_id TEXT NOT NULL,
      project_id TEXT NOT NULL,
      requirement_id TEXT,
      phase_id TEXT,
      task_id TEXT,
      level TEXT NOT NULL,
      sequence BIGINT NOT NULL,
      payload JSONB NOT NULL
    );
    CREATE INDEX IF NOT EXISTS task_logs_project_idx
      ON trama.task_logs (organization_id, project_id, created_at, sequence);
    CREATE TABLE IF NOT EXISTS trama.consumed_events (
      event_id TEXT PRIMARY KEY,
      claimed_until TIMESTAMPTZ NOT NULL,
      completed BOOLEAN NOT NULL DEFAULT FALSE
    );
    INSERT INTO trama.schema_migrations(version) VALUES (1), (2)
      ON CONFLICT DO NOTHING;
  000003_namespace_keys.sql: |
    DO $$
    BEGIN
      IF EXISTS (
        SELECT 1 FROM pg_constraint
        WHERE conrelid = to_regclass('trama.state_records')
          AND conname = 'state_records_pkey'
      ) THEN
        ALTER TABLE trama.state_records DROP CONSTRAINT state_records_pkey;
      END IF;
      IF NOT EXISTS (
        SELECT 1 FROM pg_constraint
        WHERE conrelid = to_regclass('trama.state_records')
          AND conname = 'state_records_namespace_pkey'
      ) THEN
        ALTER TABLE trama.state_records
          ADD CONSTRAINT state_records_namespace_pkey
          PRIMARY KEY (kind, organization_id, record_id);
      END IF;
    END $$;
    INSERT INTO trama.schema_migrations(version) VALUES (3)
      ON CONFLICT DO NOTHING;
