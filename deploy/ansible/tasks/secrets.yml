---
- name: Load the encrypted local Vault file
  ansible.builtin.include_vars:
    file: "{{ vault_file }}"
    name: local_vault
  no_log: true

- name: Require all local deployment credentials
  ansible.builtin.assert:
    that:
      - local_vault.database_url | default('') | length > 0
      - local_vault.redis_url | default('') | length > 0
      - local_vault.nats_url | default('') | length > 0
      - local_vault.gateway_service_account_token | default('') | length > 0
      - local_vault.gateway_organization_id | default('') | length > 0
      - local_vault.control_plane_internal_token | default('') | length > 0
      - local_vault.postgresql_username | default('') | length > 0
      - local_vault.postgresql_password | default('') | length > 0
      - local_vault.postgresql_admin_password | default('') | length > 0
    fail_msg: "The local Vault is missing one or more required deployment values."
  no_log: true

- name: Require the PostgreSQL application account expected by the chart values
  ansible.builtin.assert:
    that:
      - local_vault.postgresql_username == 'trama'
    fail_msg: "The local PostgreSQL chart uses the fixed application username 'trama'."
  no_log: true

- name: Apply the TRAMA application Secret from stdin
  ansible.builtin.command:
    argv: [kubectl, apply, -f, -]
    stdin: "{{ lookup('template', playbook_dir ~ '/templates/gateway-secret.json.j2') }}"
  no_log: true

- name: Apply the PostgreSQL authentication Secret from stdin
  ansible.builtin.command:
    argv: [kubectl, apply, -f, -]
    stdin: "{{ lookup('template', playbook_dir ~ '/templates/postgresql-secret.json.j2') }}"
  no_log: true
