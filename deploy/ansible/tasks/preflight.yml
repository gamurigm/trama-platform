---
- name: Check required local executables
  ansible.builtin.command:
    argv:
      - bash
      - -lc
      - "command -v {{ item }}"
  loop:
    - kubectl
    - helm
    - minikube
    - docker
  changed_when: false

- name: Load the encrypted local Vault file
  ansible.builtin.include_vars:
    file: "{{ vault_file }}"
    name: local_vault
  no_log: true

- name: Validate required deployment credentials
  ansible.builtin.assert:
    that:
      - local_vault.database_url | default('') | length > 0
      - local_vault.redis_url | default('') | length > 0
      - local_vault.nats_url | default('') | length > 0
      - local_vault.gateway_service_account_token | default('') | length > 0
      - local_vault.gateway_organization_id | default('') | length > 0
      - local_vault.control_plane_internal_token | default('') | length > 0
      - local_vault.postgresql_username | default('') | length > 0
      - local_vault.postgresql_password | default('') | length > 0
      - local_vault.postgresql_admin_password | default('') | length > 0
      - local_vault.postgresql_username == 'trama'
    fail_msg: "The local Vault is missing required credentials or uses an unsupported PostgreSQL username."
  no_log: true

- name: Read the active Kubernetes context
  ansible.builtin.command:
    argv: [kubectl, config, current-context]
  register: active_kube_context
  changed_when: false

- name: Require the local Minikube context
  ansible.builtin.assert:
    that:
      - active_kube_context.stdout == minikube_profile
    fail_msg: >-
      Refusing to deploy: kubectl context must be '{{ minikube_profile }}',
      current context is '{{ active_kube_context.stdout }}'.

- name: Check that the Minikube node is running
  ansible.builtin.command:
    argv: [minikube, status, --profile, "{{ minikube_profile }}", --format, "{{ '{{' }}.Host{{ '}}' }}"]
  register: minikube_host_status
  changed_when: false

- name: Require a running Minikube node
  ansible.builtin.assert:
    that:
      - minikube_host_status.stdout | trim == 'Running'
    fail_msg: "Start the '{{ minikube_profile }}' Minikube profile before deployment."

- name: Check Docker daemon connectivity
  ansible.builtin.command:
    argv: [docker, info, --format, "{{ '{{' }}.ServerVersion{{ '}}' }}"]
  changed_when: false

- name: Ensure the application namespace exists
  ansible.builtin.command:
    argv: [kubectl, create, namespace, "{{ kube_namespace }}", --dry-run=client, -o, yaml]
  register: namespace_manifest
  changed_when: false

- name: Apply the namespace manifest
  ansible.builtin.command:
    argv: [kubectl, apply, -f, -]
    stdin: "{{ namespace_manifest.stdout }}"
  register: namespace_apply
  changed_when: "'created' in namespace_apply.stdout"
