auth:
  username: trama
  database: trama
  existingSecret: trama-postgresql-auth
  secretKeys:
    adminPasswordKey: postgres-password
    userPasswordKey: password
# The pinned chart image tag has moved from bitnami to the legacy catalog.
image:
  repository: bitnamilegacy/postgresql
architecture: standalone
primary:
  persistence:
    enabled: true
    size: 8Gi
metrics:
  enabled: false
fullnameOverride: trama-postgresql
