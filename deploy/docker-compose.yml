name: trama-platform

services:
  trama-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        TRAMA_PIP_INSECURE: "${TRAMA_PIP_INSECURE:-0}"
    environment:
      TRAMA_ENV: local
      TRAMA_ORGANIZATION_ID: default
    ports:
      - "127.0.0.1:8090:8090"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
